<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="4; url=https://andreaveronica.com" />
  <title>Andrea Airall → Andrea Veronica</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #a8c8cc url('images/lightteal.jpg') center center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Mono', monospace;
    }
    .card {
      text-align: center;
      padding: 64px 48px;
      max-width: 520px;
    }
    .eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #172629;
      margin-bottom: 28px;
    }
    .headline {
      font-family: 'Playfair Display', serif;
      font-size: clamp(36px, 6vw, 56px);
      font-style: italic;
      font-weight: 400;
      color: #172629;
      line-height: 1.15;
      margin-bottom: 32px;
    }
    .headline span { color: #2a6a6e; }
    .sub {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: #3a5a5e;
      letter-spacing: 0.04em;
      margin-bottom: 48px;
      line-height: 1.7;
    }
    .sub a {
      color: #172629;
      text-decoration: none;
      border-bottom: 1px solid #172629;
      padding-bottom: 1px;
    }
    .countdown-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .countdown-ring {
      position: relative;
      width: 80px;
      height: 80px;
    }
    .countdown-ring svg { transform: rotate(-90deg); }
    .ring-bg { fill: none; stroke: #a8c8cc; stroke-width: 3; }
    .ring-progress {
      fill: none;
      stroke: #172629;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 207;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }
    .countdown-num {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 600;
      color: #172629;
    }
    .done-text {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: #172629;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 20px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">andreaairall.com</p>
    <h1 class="headline">New page,<br><span>who dis?</span></h1>
    <p class="sub">
      Redirecting you to<br>
      <a href="https://andreaveronica.com">andreaveronica.com</a>
    </p>
    <div class="countdown-wrap">
      <div class="countdown-ring">
        <svg width="80" height="80" viewBox="0 0 80 80">
          <circle class="ring-bg" cx="40" cy="40" r="33"/>
          <circle class="ring-progress" id="ring" cx="40" cy="40" r="33"/>
        </svg>
        <div class="countdown-num" id="num">3</div>
      </div>
    </div>
    <p class="done-text" id="done">heading there now ✦</p>
  </div>

  <script>
    const circumference = 2 * Math.PI * 33;
    const ring = document.getElementById('ring');
    const num = document.getElementById('num');
    const done = document.getElementById('done');
    ring.style.strokeDasharray = circumference;
    ring.style.strokeDashoffset = circumference / 3;

    setTimeout(() => {
      num.textContent = '2';
      ring.style.strokeDashoffset = (circumference / 3) * 2;
    }, 1000);

    setTimeout(() => {
      num.textContent = '1';
      ring.style.strokeDashoffset = circumference;
    }, 2000);

    setTimeout(() => {
      num.textContent = '✦';
      done.style.opacity = 1;
    }, 3000);

    setTimeout(() => {
      window.location.href = 'https://andreaveronica.com';
    }, 3500);
  </script>
</body>
</html>
